<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B4ACB">
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SimulaFuturo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="SimulaFuturo: simulador de emociones, intereses, profesiones y proyecto de vida para grados 10.º y 11.º">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,650;12..96,700;12..96,800&display=swap">
<style>/* Layout: cuaderno de exploración — barra superior fija, módulos en columna central de 1120px, acentos de resaltador */
:root {
  --bg: #F3F5F1; --surface: #FFFFFF; --sunk: #E9EDE7; --ink: #17233A; --muted: #56627A; --line: #D6DCD8;
  --accent: #2B4ACB; --accent-ink: #FFFFFF; --hl: #F3D34A; --danger: #B3261E; --ok: #1E7A4C;
  --m1: #D9486B; --m2: #C77A12; --m3: #148577; --m4: #6D4FD6; --m5: #2B6FD6; --m6: #3E8A2F;
  --a0: #D9486B; --a1: #2B6FD6; --a2: #6D4FD6; --a3: #C77A12; --a4: #148577; --a5: #E06A4B; --a6: #3E8A2F; --a7: #4A5A85; --a8: #B0478F;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --r: 14px; --r-sm: 9px;
  --shadow: 0 1px 2px rgba(23,35,58,.06), 0 6px 20px -10px rgba(23,35,58,.18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161F; --surface: #19212E; --sunk: #222C3B; --ink: #E8EDF4; --muted: #A2ADBF; --line: #313C4E;
  --accent: #8FA5FF; --accent-ink: #0E1530; --hl: #9C8420; --danger: #FF8A80; --ok: #6FD39D;
  --m1: #F27A97; --m2: #EBA94A; --m3: #45C2B0; --m4: #A890FF; --m5: #7AA7F5; --m6: #7CC768;
  --a0: #F27A97; --a1: #7AA7F5; --a2: #A890FF; --a3: #EBA94A; --a4: #45C2B0; --a5: #F79677; --a6: #7CC768; --a7: #9DAAD3; --a8: #E68CC8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11161F; --surface: #19212E; --sunk: #222C3B; --ink: #E8EDF4; --muted: #A2ADBF; --line: #313C4E;
  --accent: #8FA5FF; --accent-ink: #0E1530; --hl: #9C8420; --danger: #FF8A80; --ok: #6FD39D;
  --m1: #F27A97; --m2: #EBA94A; --m3: #45C2B0; --m4: #A890FF; --m5: #7AA7F5; --m6: #7CC768;
  --a0: #F27A97; --a1: #7AA7F5; --a2: #A890FF; --a3: #EBA94A; --a4: #45C2B0; --a5: #F79677; --a6: #7CC768; --a7: #9DAAD3; --a8: #E68CC8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 650; }
h3, .h3 { font-size: 1.12rem; font-weight: 650; }
h4 { font-size: 1rem; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.tiny { font-size: .8rem; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--muted); }
.lead { font-size: 1.12rem; max-width: 62ch; }
mark { background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .08em; }
.icon { flex: none; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; z-index: 50; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.tb-inner { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; padding: 4px 0; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: var(--hl); display: grid; place-items: center; }
.menu-btn { display: none; margin-left: auto; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
.mainnav { margin-left: auto; min-width: 0; }
.mainnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; flex-wrap: wrap; }
.mainnav button { background: none; border: 0; padding: 7px 10px; border-radius: 999px; cursor: pointer; font-size: .86rem; display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 700; }
.mainnav button:hover { background: var(--sunk); color: var(--ink); }
.mainnav button.on { background: var(--ink); color: var(--bg); }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--c); }
.nav-dot.on { background: var(--c); }
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .mainnav { display: none; width: 100%; margin: 0; }
  .mainnav.open { display: block; }
  .mainnav ul { flex-direction: column; padding-block: 6px; }
  .mainnav button { width: 100%; font-size: 1rem; padding: 10px 12px; }
}

.main { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot { border-top: 1px solid var(--line); background: var(--surface); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; display: grid; gap: 10px; justify-items: center; }
.foot p { font-family: var(--f-display); font-size: 1.02rem; max-width: 60ch; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 18px; border: 1.5px solid transparent; cursor: pointer; font-weight: 700; font-size: .95rem; line-height: 1.2; text-align: left; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.big { padding: 13px 22px; font-size: 1.02rem; }
.btn.small { padding: 6px 12px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); }
.iconbtn:hover:not(:disabled) { color: var(--ink); background: var(--sunk); }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.iconbtn.xs { width: 22px; height: 22px; border: 0; background: transparent; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; margin-top: 8px; }
.row.wrap { flex-wrap: wrap; }
.stack { display: grid; gap: 16px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: .9rem; font-weight: 700; color: var(--ink); text-align: left; }
.chip:hover { border-color: var(--c, var(--accent)); }
.chip.on { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); border-color: var(--c, var(--accent)); }
.chip.static { cursor: default; background: var(--sunk); border-color: transparent; font-weight: 600; font-size: .82rem; padding: 4px 10px; }
.chip.static.strong { background: color-mix(in srgb, var(--m6) 18%, var(--surface)); }
.pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }

/* Feedback */
.feedback { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--hl) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--hl) 60%, var(--line)); margin-block: 14px; font-size: .95rem; }
.feedback.ok { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.fb-mark { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .9rem; }

/* Forms */
.field { display: grid; gap: 6px; margin-block: 12px; min-width: 0; }
.field label, .label-like { font-weight: 700; font-size: .95rem; }
.hint { font-size: .82rem; color: var(--muted); }
input[type=text], input[type=search], textarea, select { width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 9px 12px; }
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-size: .9rem; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.switch.big { margin-top: 10px; }

/* Module header */
.module { display: grid; gap: 22px; }
.module.narrow { max-width: 900px; }
.mod-head { display: flex; gap: 18px; align-items: flex-start; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.mod-badge { flex: none; width: 58px; height: 58px; border-radius: 16px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--c); display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--c) 40%, transparent); }
.mod-badge.sm { width: 42px; height: 42px; border-radius: 12px; }
.mod-q { font-family: var(--f-display); font-size: 1.2rem; color: var(--c); font-weight: 600; margin-top: 4px; }
.mod-intro { max-width: 70ch; margin-top: 8px; color: var(--muted); }
.mod-head .eyebrow { color: var(--c); margin-bottom: 4px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 12px 28px; }
.hero h1 { font-size: clamp(2.2rem, 5.6vw, 4rem); font-weight: 800; letter-spacing: -0.025em; line-height: 1.02; margin-block: 10px 18px; max-width: 16ch; }
.hero .lead { color: var(--muted); margin-bottom: 22px; }
.paths-art { width: 100%; max-width: 420px; justify-self: center; }
.paths-art path { fill: none; stroke-linecap: round; }
.pa-road { stroke: var(--ink); stroke-width: 5; }
.pa-r1, .pa-r2, .pa-r3, .pa-r4 { stroke: var(--muted); stroke-width: 3; stroke-dasharray: 2 9; }
.pa-you { fill: var(--hl); stroke: var(--ink); stroke-width: 2.5; }
.pa-node { fill: var(--ink); }
.pa-dest { stroke: var(--surface); stroke-width: 3; }
.pa-label { font-family: var(--f-display); font-size: 13px; fill: var(--muted); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .pa-r1, .pa-r2, .pa-r3, .pa-r4 { animation: dash 14s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -110; } }
}
.progress-band { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; margin-bottom: 22px; }
.prog-dots { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.prog-dots li button { width: 38px; height: 38px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--c) 60%, var(--line)); background: transparent; color: var(--c); display: grid; place-items: center; cursor: pointer; }
.prog-dots li.on button { border-style: solid; background: var(--c); color: var(--surface); }
.mod-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mod-card { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; position: relative; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.mod-card:hover { border-color: var(--c); transform: translateY(-2px); }
.mc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mc-n { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--c); }
.mc-title { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; line-height: 1.15; }
.mc-q { font-family: var(--f-display); color: var(--muted); font-weight: 500; }
.mc-blurb { font-size: .9rem; color: var(--muted); flex: 1; }
.mc-principle { align-self: flex-start; margin-top: 8px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: linear-gradient(transparent 50%, color-mix(in srgb, var(--hl) 70%, transparent) 50%); }
.home-bottom { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 22px; }
.side-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side-card.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: .92rem; }
.plain li { display: flex; gap: 10px; align-items: flex-start; }
.plain .icon { color: var(--accent); margin-top: 2px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .paths-art { max-width: 320px; } .mod-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .home-bottom { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .mod-grid { grid-template-columns: 1fr; } }

.notice { max-width: 1240px; margin: 14px auto 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--hl) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--hl) 60%, var(--line)); border-radius: var(--r); padding: 12px 16px; margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1272px) { .notice { margin-left: auto; margin-right: auto; } }
.notice p { flex: 1 1 320px; }

/* Situation flow */
.flow { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.sit-list ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.sit-btn { width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px; cursor: pointer; display: grid; gap: 3px; }
.sit-btn:hover { border-color: var(--ink); }
.sit-btn.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.sit-btn.on .sit-tag { color: var(--hl); }
.sit-tag { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sit-title { font-family: var(--f-display); font-weight: 650; line-height: 1.2; }
.sit-btn .pill { justify-self: start; margin-top: 4px; }
.flow-main { min-width: 0; display: grid; gap: 14px; }
.stepper ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; counter-reset: s; }
.stepper button { width: 100%; background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 4px; padding: 4px 2px; position: relative; color: var(--muted); }
.stepper li:not(:last-child) button::after { content: ""; position: absolute; top: 18px; left: calc(50% + 18px); right: calc(-50% + 14px); height: 2px; background: var(--line); }
.st-n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: .85rem; position: relative; z-index: 1; }
.st-l { font-size: .76rem; font-weight: 700; text-align: center; }
.stepper li.done .st-n { border-color: var(--accent); color: var(--accent); }
.stepper li.cur .st-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper li.cur .st-l { color: var(--ink); }
@media (max-width: 520px) { .st-l { font-size: .62rem; } .st-n { width: 26px; height: 26px; } }
.flow-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.flow-card h3 { margin-top: 8px; }
.scene { font-size: 1.15rem; line-height: 1.6; padding: 16px 18px; border-left: 4px solid var(--hl); background: var(--sunk); border-radius: 0 var(--r-sm) var(--r-sm) 0; max-width: 68ch; }
.signals { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: .92rem; color: var(--muted); }
.signals strong { color: var(--ink); }
.alts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.alt { border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 13px; display: grid; gap: 8px; align-content: start; }
.alt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.alt .btn { justify-self: start; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; font-weight: 600; }
.choice:hover { border-color: var(--ink); }
.choice.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.choice .pill { margin-left: auto; }
.radio { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.choice.on .radio { border: 6px solid var(--accent); }
.chosen-label { font-size: 1.05rem; }
.conseq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.conseq > div { background: var(--sunk); border-radius: var(--r-sm); padding: 12px 14px; }
.conseq ul { margin: 6px 0 0; padding-left: 18px; font-size: .93rem; }
.reconsider { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1.5px dashed var(--accent); border-radius: var(--r-sm); padding: 12px 14px; margin-top: 8px; }
.reconsider p { flex: 1 1 280px; font-size: .93rem; }
.whatif { background: var(--sunk); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 8px; }
.whatif select { max-width: 320px; }
@media (max-width: 860px) { .flow { grid-template-columns: 1fr; } .sit-list ul { grid-auto-flow: column; grid-auto-columns: minmax(200px, 72%); overflow-x: auto; padding-bottom: 6px; } }
@media (max-width: 620px) { .alts, .conseq { grid-template-columns: 1fr; } .flow-card { padding: 18px 16px; } }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
table.compare { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .9rem; }
.compare th, .compare td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.compare thead th { background: var(--sunk); font-family: var(--f-display); font-size: .95rem; }
.compare tbody th { color: var(--muted); font-weight: 700; width: 150px; }
.compare tr:last-child th, .compare tr:last-child td { border-bottom: 0; }
.compare.guide tbody th { color: var(--ink); }

/* Selfeval */
.selfeval { border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--surface); }
.se-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; padding: 16px 20px; cursor: pointer; text-align: left; }
.se-toggle > span:first-child { display: grid; gap: 2px; }
.se-title { font-family: var(--f-display); font-weight: 650; font-size: 1.1rem; }
.se-count { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.se-body { padding: 0 20px 18px; }

/* Interests */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.split-main { min-width: 0; display: grid; gap: 14px; align-content: start; }
@media (max-width: 960px) { .split { grid-template-columns: 1fr; } .side-card.sticky { position: static; } }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
[role=tabpanel] { display: grid; gap: 14px; }
.acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.acard { background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--c); border-radius: var(--r-sm); padding: 13px; display: grid; gap: 10px; align-content: space-between; }
.acard.v-si { background: color-mix(in srgb, var(--c) 10%, var(--surface)); border-color: var(--c); }
.acard.v-no { opacity: .7; }
.acard-area { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
.acard-t { font-family: var(--f-display); font-weight: 600; font-size: 1.04rem; line-height: 1.25; }
.acard-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.acard-btns button { flex: 1 1 auto; font-size: .78rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); padding: 6px 7px; border-radius: 7px; cursor: pointer; }
.acard-btns button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.challenge { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface); margin: 0; min-width: 0; }
.challenge legend { font-family: var(--f-display); font-weight: 650; font-size: 1.08rem; padding: 0 6px; }
.challenge .choices { margin-top: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 620px) { .challenge .choices { grid-template-columns: 1fr; } }
.skill-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.skill-group { border-left: 4px solid var(--c); padding: 4px 0 4px 12px; display: grid; gap: 8px; }
.skill-group .chip { --c: inherit; }
.exp-form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 18px 18px; }
.exp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.exp-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 8px; }
.exp-t { font-family: var(--f-display); font-weight: 650; }
.ichart ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ichart li { display: grid; grid-template-columns: 100px minmax(0, 1fr) 76px; gap: 8px; align-items: center; font-size: .85rem; }
.ic-name { font-weight: 700; }
.ic-track { height: 12px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.ic-bar { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
.ic-val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .76rem; text-align: right; }

/* Professions */
.filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; background: var(--surface); flex: 1 1 260px; max-width: 460px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 9px 0; box-shadow: none !important; color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; }
.pcard .row { margin-top: 4px; }
.pc-field { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--m3); }
.pc-routes { display: flex; flex-wrap: wrap; gap: 4px; }
.conn { font-size: .82rem; font-weight: 700; color: var(--m3); display: flex; gap: 6px; align-items: flex-start; background: color-mix(in srgb, var(--m3) 10%, var(--surface)); padding: 6px 9px; border-radius: 8px; }
.pdetail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 14px; }
.pdetail > .btn { justify-self: start; }
.pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pd-grid > div { background: var(--sunk); border-radius: var(--r-sm); padding: 14px; }
.pd-grid h3 { font-size: .98rem; margin-bottom: 6px; }
.pd-grid ul { margin: 0; padding-left: 18px; font-size: .92rem; }
.related { display: grid; gap: 8px; }
.reflect-box { border-top: 1.5px dashed var(--line); padding-top: 8px; }
.empty { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 34px 18px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); }
.empty p { max-width: 56ch; color: var(--ink); }
.empty .chips { justify-content: center; }
.network .net-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 10px; }
.network svg { width: 100%; min-width: 520px; height: auto; display: block; }
.net-edge { stroke: var(--line); stroke-width: 2; }
.net-node { cursor: pointer; }
.net-node rect { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
.net-node text { font-family: var(--f-body); font-size: 12px; font-weight: 700; fill: var(--muted); }
.net-node.saved rect { fill: var(--m3); stroke: var(--m3); stroke-dasharray: none; }
.net-node.saved text { fill: var(--surface); }
.net-node:hover rect, .net-node:focus rect { stroke: var(--ink); stroke-width: 2.5; }
.net-node:focus { outline: none; }

/* Life project */
.lp-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.lp-summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.dimbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.dimbars li { display: grid; grid-template-columns: 170px minmax(0, 1fr) 24px; gap: 10px; align-items: center; font-size: .84rem; }
.db-track { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.db-track span { display: block; height: 100%; border-radius: 999px; transition: width .35s; }
.db-n { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.lp-actions { display: grid; gap: 14px; justify-items: start; }
@media (max-width: 860px) { .lp-top { grid-template-columns: 1fr; } }
@media (max-width: 440px) { .dimbars li { grid-template-columns: 120px minmax(0, 1fr) 20px; } }
.goal-form { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 18px 20px; }
.goal-form .row.wrap > .field { flex: 1 1 220px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
.col { background: var(--sunk); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 4px 6px; border-bottom: 2px solid var(--ink); }
.col-empty { border: 1.5px dashed var(--line); border-radius: var(--r-sm); background: transparent; padding: 14px; cursor: pointer; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; justify-content: center; }
.col-empty:hover { color: var(--ink); border-color: var(--ink); }
.goal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.goal { background: var(--surface); border-radius: var(--r-sm); padding: 12px 13px; display: grid; gap: 8px; border-left: 5px solid var(--c); box-shadow: var(--shadow); }
.goal.paused { opacity: .72; border-left-style: dashed; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.dim-tag { font-size: .72rem; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .06em; }
.goal-what { font-family: var(--f-display); font-weight: 650; font-size: 1.04rem; line-height: 1.25; }
.progress { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pstep { width: 22px; height: 10px; border-radius: 4px; border: 1.5px solid var(--c); background: transparent; cursor: pointer; padding: 0; }
.pstep.on { background: var(--c); }
.progress .tiny { margin-left: 6px; color: var(--muted); font-weight: 700; }
.goal-dl { margin: 0; display: grid; gap: 4px; font-size: .86rem; }
.goal-dl dt { font-weight: 700; color: var(--muted); margin-top: 4px; }
.goal-dl dd { margin: 0; white-space: pre-wrap; }
.goal-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.confirm { background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--line)); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 8px; font-size: .9rem; }

/* Map */
.mapgrid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(180px, auto); gap: 18px; }
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.map-lines line { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; opacity: .6; }
.branch, .map-center { position: relative; z-index: 1; }
.branch { background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--c); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.branch h3 { font-size: 1rem; }
.branch.change { --c: var(--hl); border-style: dashed; border-top-style: solid; background: color-mix(in srgb, var(--hl) 10%, var(--surface)); }
.bitems { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.bitems li { display: inline-flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-radius: 999px; padding: 3px 4px 3px 11px; font-size: .84rem; font-weight: 600; max-width: 100%; }
.bitems li span { overflow-wrap: anywhere; }
.bitems li.mine { background: var(--surface); border: 1.5px dashed var(--c); }
.branch.change .bitems li.mine { border-color: var(--ink); }
.badd { display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 6px; margin-top: auto; }
.badd.col2 { grid-template-columns: 104px minmax(0, 1fr) 32px; }
.badd input, .badd select { padding: 6px 10px; font-size: .86rem; }
.map-center { display: grid; place-content: center; text-align: center; gap: 4px; background: var(--ink); color: var(--bg); border-radius: 50%; aspect-ratio: 1; max-width: 100%; width: min(230px, 100%); justify-self: center; align-self: center; padding: 18px; }
.map-center .eyebrow { color: var(--hl); }
.map-center .muted { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.mc-title { font-family: var(--f-display); font-size: 1.9rem; font-weight: 800; }
@media (max-width: 900px) {
  .mapgrid { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .map-lines { display: none; }
  .map-center { order: -1; border-radius: var(--r); aspect-ratio: auto; width: 100%; }
}
.export { background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; }
.sum-ta { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }
.tl-section { display: grid; gap: 10px; }
.timeline ol { list-style: none; margin: 10px 0 0; padding: 0 0 0 4px; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.timeline li::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.tl-dot { width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1.5px var(--c); margin-top: 2px; }
.tl-meta { font-size: .76rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-text { font-size: .93rem; }
.timeline.compact li { padding-bottom: 10px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
ul.small { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Misiones */
.mission { background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 16px 20px; display: grid; gap: 12px; }
.mission.complete { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.mission.complete .eyebrow { color: var(--ok); }
.mi-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.mi-copy { display: grid; gap: 4px; min-width: 0; }
.mi-text { font-size: 1.2rem; font-weight: 700; }
.mi-count { font-family: var(--f-display); font-size: 1rem; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mi-count span { font-size: 2rem; color: var(--ink); }
.mi-tasks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mi-tasks li { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; padding: 10px 12px; border-radius: var(--r-sm); background: var(--sunk); min-width: 0; }
.mi-tasks li.done { background: color-mix(in srgb, var(--ok) 13%, var(--surface)); }
.mi-check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: .78rem; color: var(--muted); }
.mi-tasks li.done .mi-check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.mi-fb { font-weight: 700; font-size: .92rem; color: var(--ok); }
@media (max-width: 760px) { .mi-tasks { grid-template-columns: 1fr; } }

/* Cierre */
.se-final { padding: 18px 20px 6px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.se-final .field label { font-family: var(--f-display); font-size: 1.05rem; font-weight: 650; }

/* Predicción */
.predict { border-left: 4px solid var(--m4); padding-left: 14px; }
.prediction { background: color-mix(in srgb, var(--m4) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--m4) 35%, var(--line)); border-radius: var(--r-sm); padding: 12px 14px; }
.prediction > p:nth-child(2) { font-style: italic; margin-top: 2px; }
.prediction .field { margin-bottom: 0; }

/* Reto de conexión y decisión */
.challenge-wrap { display: grid; gap: 12px; }
.how-list { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: .93rem; }
.others summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .92rem; }
.decide-box { border: 1.5px solid var(--m3); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; margin-top: 14px; background: var(--surface); }

/* Próximo paso */
.next-step { background: color-mix(in srgb, var(--hl) 16%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--hl) 70%, var(--line)); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; }
.ns-form { flex-wrap: nowrap; }
.ns-form input { flex: 1; min-width: 0; }
@media (max-width: 560px) { .ns-form { flex-wrap: wrap; } }
.hero-how { max-width: 62ch; margin: -8px 0 20px; padding: 8px 12px; border-left: 3px solid var(--hl); }
.sit-list, .flow > * { min-width: 0; }
.brand-name { letter-spacing: -0.01em; } .brand-name b { color: var(--accent); font-weight: 800; }
/* ===== Asistente de exploración ===== */
.ai-wrap { display: grid; gap: 16px; }
.ai-form .counter { justify-self: end; font-variant-numeric: tabular-nums; }
.privacy { display: flex; gap: 8px; align-items: flex-start; background: var(--sunk); border-radius: var(--r-sm); padding: 10px 12px; color: var(--muted); }
.privacy .icon { color: var(--accent); margin-top: 1px; }
.ai-loading { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--accent); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: .35; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }
}
.ai-note { padding: 10px 12px; border-radius: var(--r-sm); border: 1px dashed var(--line); }
.ai-result { border-color: color-mix(in srgb, var(--m3) 45%, var(--line)); }
.ai-res-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ai-support { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--m1) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--m1) 40%, var(--line)); }
.ai-support .icon { color: var(--m1); margin-top: 2px; }
.q-group { display: grid; gap: 6px; }
.q-type { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--m3); margin-top: 6px; }
.q-list, .steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.q-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); cursor: pointer; font-size: .95rem; min-height: 48px; }
.q-item.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.q-item input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--accent); }
.q-item .pill { margin-left: 8px; }
.steps-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.step-card { border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 8px; align-content: start; }
.step-card .pill { justify-self: start; background: color-mix(in srgb, var(--hl) 40%, var(--surface)); color: var(--ink); }
.step-t { font-weight: 700; }
.step-card .row { margin-top: auto; }
.ai-eval { border-top: 1.5px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.ai-eval .btn { justify-self: start; }
.ai-saved { background: var(--sunk); border-radius: var(--r-sm); padding: 12px 14px; }
.key-box { border: 1.5px dashed var(--accent); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 8px; margin-block: 6px; }
.key-box .label-like { display: flex; gap: 6px; align-items: center; }
.key-box .label-like .icon { color: var(--accent); }
.key-form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.key-form input[type=password], .key-form input[type=text] { font-family: ui-monospace, Menlo, Consolas, monospace; }
.key-form .switch { grid-column: 1 / -1; font-weight: 600; }
@media (max-width: 560px) { .key-form { grid-template-columns: 1fr 1fr; } .key-form input { grid-column: 1 / -1; } }
@media (max-width: 900px) { .steps-list { grid-template-columns: 1fr; } }

/* ===== Evaluación y panel docente ===== */
.home-bottom { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.eval-cta { border: 1.5px solid var(--accent); }
.eval-cta .btn { justify-self: start; }
.eval-progress { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.eval-progress > span:not(.tiny) { width: 36px; height: 6px; border-radius: 999px; background: var(--line); }
.eval-progress > span.done { background: var(--accent); }
.eval-progress > span.cur { background: var(--hl); }
.eval-progress .tiny { margin-left: 6px; }
.rate { border: 0; padding: 12px 0; margin: 0; border-top: 1px solid var(--line); min-width: 0; }
